<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./fonts.css" />
<style>
  html, body { margin: 0; }
  #art { position: relative; width: 1024px; height: 500px; overflow: hidden; font-family: var(--promo-font);
    background: radial-gradient(circle at 70% 30%, #8fe0ff 0, #3a9bff 42%, #1d55d8 100%); }
  .rays { position: absolute; left: 70%; top: 30%; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.11) 0 7deg, rgba(255,255,255,0) 7deg 14deg);
    -webkit-mask: radial-gradient(circle, #000 0, transparent 55%); mask: radial-gradient(circle, #000 0, transparent 55%); }
  .scene { position: absolute; width: 700px; right: -60px; bottom: -30px; filter: drop-shadow(0 18px 18px rgba(0,0,0,.25)); }
  .txt { position: absolute; left: 44px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 18px; z-index: 2; }
  .logo { margin: 0; line-height: .9; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 104px; color: #fff; letter-spacing: -1px;
    paint-order: stroke fill; -webkit-text-stroke: 14px #133a95; text-shadow: 0 8px 0 #133a95, 0 16px 26px rgba(0,0,0,.25); }
  .logo b { display: block; color: #ffd43b; font-weight: 800; }
  .pill { background: #fff; color: #1d3f9c; font-weight: 800; font-size: var(--fs, 34px); line-height: 1.15; padding: 12px 26px 10px; border-radius: 999px;
    box-shadow: 0 6px 0 #133a95, 0 14px 24px rgba(0,0,0,.2); max-width: 440px; box-sizing: border-box; text-wrap: balance; }
  [dir=rtl] .txt { left: auto; right: 44px; align-items: flex-end; }
  [dir=rtl] .scene { right: auto; left: -60px; }
  [dir=rtl] .logo { direction: ltr; text-align: right; }
  [dir=rtl] #art { background: radial-gradient(circle at 30% 30%, #8fe0ff 0, #3a9bff 42%, #1d55d8 100%); }
  [dir=rtl] .rays { left: 30%; }
</style>
</head>
<body>
<div id="art">
  <div class="rays"></div>
  <img class="scene" src="./.work/scene.png" />
  <div class="txt"><h1 class="logo">Commute<b>Craze</b></h1><div class="pill" id="tag"></div></div>
</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') || 'en';
  const C = await (await fetch('./captions.json')).json();
  document.documentElement.lang = lang;
  document.documentElement.dir = ['ar', 'fa', 'he', 'ur'].includes(lang) ? 'rtl' : 'ltr';
  const tag = document.getElementById('tag');
  tag.textContent = C[lang].tag;
  await document.fonts.ready;
  const img = document.querySelector('.scene');
  if (!img.complete) await new Promise((r) => (img.onload = r));
  let fs = 34;
  while (fs > 20 && tag.getBoundingClientRect().height > 100) { fs -= 2; tag.style.setProperty('--fs', fs + 'px'); }
  window.__done = true;
</script>
</body>
</html>
