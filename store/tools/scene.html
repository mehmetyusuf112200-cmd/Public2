<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; }
  #art { position: relative; width: 2048px; height: 1000px; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 2048px; height: 1000px; }
</style>
</head>
<body>
<div id="art"><canvas id="c" width="2048" height="1000"></canvas></div>
<script type="module">
  // Language-independent 3D hero scene for the feature graphic / video end card:
  // a little parking-lot island with the game's real vehicles and passengers.
  import { stage, vehicle, passenger, tree, bush, THREE } from './kit.js';
  const q = new URLSearchParams(location.search);
  { let sd = 21; Math.random = () => ((sd = (sd * 16807) % 2147483647) / 2147483647); }
  const W = 2048, H = 1000;
  const S = stage(document.getElementById('c'), W, H, { fov: 24 });
  S.ground.visible = false;
  S.sun.shadow.camera.left = -12; S.sun.shadow.camera.right = 12; S.sun.shadow.camera.top = 12; S.sun.shadow.camera.bottom = -12;
  S.sun.position.set(-6, 14, 8);

  const R0 = 5.2;
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(R0, R0, 0.3, 96), new THREE.MeshStandardMaterial({ color: 0x4cc35a, roughness: 0.85 }));
  grass.position.y = -0.15; grass.receiveShadow = true;
  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(R0 * 0.99, R0 * 0.94, 0.6, 96), new THREE.MeshStandardMaterial({ color: 0x9a6a3e, roughness: 0.9 }));
  dirt.position.y = -0.6;
  S.scene.add(grass, dirt);
  // parking lot pad
  const lot = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.04, 4.2), new THREE.MeshStandardMaterial({ color: 0x9aa0c8, roughness: 0.8 }));
  lot.position.set(0.3, 0.01, 0.6); lot.receiveShadow = true; S.scene.add(lot);
  const lineM = new THREE.MeshStandardMaterial({ color: 0xffffff });
  for (let i = -2; i <= 3; i++) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 4.0), lineM); l.position.set(0.3 + i * 1.0 - 0.5, 0.02, 0.6); S.scene.add(l); }
  // road at the back with the waiting queue
  const road = new THREE.Mesh(new THREE.BoxGeometry(R0 * 2, 0.03, 1.3), new THREE.MeshStandardMaterial({ color: 0x4a5160, roughness: 0.85 }));
  road.position.set(0, 0.015, -2.5); road.receiveShadow = true; S.scene.add(road);
  for (let k = -4; k <= 4; k++) { const d = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.035, 0.07), new THREE.MeshStandardMaterial({ color: 0xffd23f })); d.position.set(k * 1.15, 0.02, -2.5); S.scene.add(d); }
  const walk = new THREE.Mesh(new THREE.BoxGeometry(R0 * 1.7, 0.06, 0.9), new THREE.MeshStandardMaterial({ color: 0xf1dcb5, roughness: 0.9 }));
  walk.position.set(0, 0.03, -3.55); walk.receiveShadow = true; S.scene.add(walk);

  const put = (m, x, z, rot) => { m.position.set(x, 0, z); m.rotation.y = rot; S.scene.add(m); return m; };
  // a bus pulling out onto the road (boarding), others parked in the lot
  put(vehicle('bus', 'yellow', 'city', { noArrow: true }), -1.2, -2.5, -Math.PI / 2);
  put(vehicle('van', 'pink', 'minibus'), -1.7, 0.4, 0);
  put(vehicle('car', 'red', 'sport'), -0.7, 1.4, Math.PI);
  put(vehicle('car', 'blue', 'police'), 0.3, 0.1, Math.PI / 2 * 0);
  put(vehicle('van', 'green', 'icecream'), 1.3, 1.1, Math.PI);
  put(vehicle('car', 'purple', 'beetle'), 2.3, 0.0, 0);
  put(vehicle('car', 'orange', 'taxi'), 2.3, 1.9, Math.PI);
  put(vehicle('bus', 'cyan', 'double'), 3.45, 0.75, 0);
  // passenger queue (yellow ones about to board the yellow bus)
  const qcols = ['yellow', 'yellow', 'yellow', 'pink', 'pink', 'red', 'blue', 'blue', 'green', 'purple', 'orange'];
  qcols.forEach((c, i) => { const p = passenger(c); p.scale.setScalar(1.25); p.position.set(0.9 + i * 0.42, 0.06, -3.5); p.rotation.y = -Math.PI / 2 + 0.3; S.scene.add(p); });
  [[-4.2, -1.0, 1.4], [-3.6, 2.2, 1.1], [4.4, -1.4, 1.3], [-4.6, 0.8, 1.0], [4.5, 2.2, 1.0], [-2.6, -4.3, 1.2], [3.0, -4.3, 1.1]].forEach(([x, z, s]) => { const t = tree(); t.position.set(x, 0, z); t.scale.setScalar(s); S.scene.add(t); });
  [[-3.4, 3.4], [3.4, 3.4], [-4.8, -2.4]].forEach(([x, z]) => { const b = bush(); b.position.set(x, 0, z); b.scale.setScalar(1.4); S.scene.add(b); });

  const k = Number(q.get('k') || 1);
  S.camera.position.set(Number(q.get('cx') ?? 0), 9.5 * k, 13.5 * k);
  S.camera.lookAt(Number(q.get('lx') ?? 0), 0, Number(q.get('lz') ?? -0.3));
  S.render();
  window.__done = true;
</script>
</body>
</html>
