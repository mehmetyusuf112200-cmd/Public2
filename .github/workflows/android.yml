name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install & test
        run: |
          npm ci
          npm test

      - name: Build web & sync
        run: |
          npm run build
          npx cap sync android

      - name: Build APK (debug, for testing) and AAB (release, unsigned)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease 2>&1 | tee ../gradle.log

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/CommuteCraze-test-v1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/CommuteCraze-unsigned-v1.0.${{ github.run_number }}.aab

      - uses: actions/upload-artifact@v4
        with:
          name: commute-craze-${{ github.run_number }}
          path: out/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Commute Craze v1.0.${{ github.run_number }}
          body: |
            Test APK: telefona indirip kurabilirsin (Bilinmeyen kaynaklara izin ver).
            AAB dosyası imzasızdır; Play Console'a imzalanmış sürüm yüklenir.
          files: out/*

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          tail -c 60000 gradle.log > /tmp/build.log 2>/dev/null || echo "no gradle log" > /tmp/build.log
          git checkout --orphan ci-logs
          git rm -rfq --cached . >/dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-logs
