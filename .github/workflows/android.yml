name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install & test
        run: |
          npm ci
          npm test

      - name: Build web & sync
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          npm run build
          npx cap sync android

      # Signing key comes from repository secrets (Settings > Secrets and variables > Actions).
      # If the secrets are missing the AAB is built unsigned.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK (test) and AAB (Play Store)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease 2>&1 | tee ../gradle.log

      - name: Collect outputs
        run: |
          mkdir -p out
          V=1.0.${{ github.run_number }}
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/CommuteCraze-TEST-$V.apk"
          if [ "$SIGNED" = "1" ]; then AAB="out/CommuteCraze-PlayStore-$V.aab"; else AAB="out/CommuteCraze-IMZASIZ-$V.aab"; fi
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          # fixed names so the "latest" download links never change
          cp "out/CommuteCraze-TEST-$V.apk" out/CommuteCraze-TEST.apk
          cp "$AAB" out/CommuteCraze-PlayStore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: commute-craze-${{ github.run_number }}
          path: out/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Commute Craze v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            📱 **Telefonda test:** `CommuteCraze-TEST.apk` dosyasını telefondan indirip kur (Bilinmeyen kaynaklara izin ver).
            🏪 **Play Store:** `CommuteCraze-PlayStore.aab` dosyasını Play Console'a yükle.
            ${{ env.SIGNED == '1' && '✅ AAB yükleme anahtarıyla imzalı.' || '⚠️ AAB imzasız — GitHub Secrets ayarlanmamış (README''ye bak).' }}
          files: out/*

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          tail -c 60000 gradle.log > /tmp/build.log 2>/dev/null || echo "no gradle log" > /tmp/build.log
          git checkout --orphan ci-logs
          git rm -rfq --cached . >/dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-logs
